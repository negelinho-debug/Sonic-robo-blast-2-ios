name: Sonic Robo Blast 2 iOS Port v13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Sonic Robo Blast 2 iOS IPA v13
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Get Sonic Robo Blast 2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch SRB2_release_2.2.13 \
            https://github.com/STJr/SRB2.git SRB2
          mkdir -p output
          (cd SRB2 && git rev-parse HEAD) | tee output/source.txt

      - name: Get Android port files and icon
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output apk-src

          # v2 used the GitHub Releases API and hit HTTP 403 rate limiting.
          # v3 skips the API completely and downloads the exact release asset
          # directly by its stable GitHub release URL.
          APK_URL="https://github.com/SRB2-Mobile/SRB2-Android/releases/download/android-port-build-v2213-patch1/srb2-android-v2213-gameFull-release-patch1.apk"

          echo "$APK_URL" | tee output/apk-url.txt

          curl -L --fail --retry 5 --retry-delay 3 \
            "$APK_URL" \
            -o SRB2-Android-v2213-patch1.apk

          echo "===== APK ====="
          ls -lh SRB2-Android-v2213-patch1.apk
          shasum -a 256 SRB2-Android-v2213-patch1.apk \
            | tee output/apk-sha256.txt

          unzip -oq SRB2-Android-v2213-patch1.apk -d apk-src

          echo "===== APK ASSETS ====="
          find apk-src/assets -maxdepth 3 -type f -print \
            | sort \
            | tee output/apk-assets.txt

          test -f apk-src/lib/arm64-v8a/libmain.so

          # Do NOT pipe strings directly into `grep -m1` under
          # `set -o pipefail`: grep exits after the first match, which closes
          # the pipe and makes Apple's `strings` report "failed to flush output".
          # v3 died here even though the APK was downloaded/extracted correctly.
          strings apk-src/lib/arm64-v8a/libmain.so \
            > output/libmain-strings.txt 2>/dev/null || true

          VERSION_LINE="$(
            grep -F "Sonic Robo Blast 2 v2.2.13" \
              output/libmain-strings.txt \
              | head -1 || true
          )"

          if [ -z "$VERSION_LINE" ]; then
            echo "ERROR: expected SRB2 v2.2.13 marker not found in libmain.so"
            exit 1
          fi

          printf '%s\n' "$VERSION_LINE" \
            | tee output/apk-version.txt

          # Exact launcher icon from the supplied Android build.
          if [ -f apk-src/res/C9.png ]; then
            cp apk-src/res/C9.png output/SRB2-Android-Icon.png
          elif [ -f apk-src/res/CG.png ]; then
            cp apk-src/res/CG.png output/SRB2-Android-Icon.png
          else
            echo "ERROR: Android launcher icon not found"
            exit 1
          fi

          test -f apk-src/assets/splash.png
          cp apk-src/assets/splash.png output/SRB2-Android-Splash.png

          for f in \
            android.pk3 \
            srb2.pk3 \
            zones.pk3 \
            player.dta \
            patch.pk3 \
            music.dta
          do
            if [ -f "apk-src/assets/$f" ]; then
              echo "$f=FOUND"
            else
              echo "$f=MISSING"
            fi
          done | tee output/game-data.txt

      - name: Prepare iOS build tools
        shell: bash
        run: |
          set -euo pipefail

          # Do not use Homebrew CMake 4.x here. SRB2 2.2.13 pulls older
          # third-party CMake projects that are much more reliable on CMake 3.x.
          brew install ninja pkg-config || true

          python3 -m venv "$RUNNER_TEMP/srb2-cmake"
          "$RUNNER_TEMP/srb2-cmake/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/srb2-cmake/bin/pip" install "cmake==3.31.6"

          # GITHUB_PATH is applied to every following step.
          echo "$RUNNER_TEMP/srb2-cmake/bin" >> "$GITHUB_PATH"

          xcodebuild -version
          "$RUNNER_TEMP/srb2-cmake/bin/cmake" --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Prepare SDL2 libraries for iPhone arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg install \
            zlib:arm64-ios \
            libpng:arm64-ios \
            sdl2:arm64-ios \
            libgme:arm64-ios

          echo "===== VCPKG IOS LIBRARIES ====="
          find vcpkg/installed/arm64-ios/lib -maxdepth 1 -type f \
            \( -name '*z*' -o -name '*gme*' \) -print | sort \
            | tee output/vcpkg-ios-libraries.txt

      - name: Patch SRB2 for iOS first boot
        shell: bash
        run: |
          set -euo pipefail

          cat > SRB2/src/sdl/ios_bootstrap.c <<'C'
          #include <mach-o/dyld.h>
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <unistd.h>

          static void mkdir_if_needed(const char *path)
          {
              if (path && path[0])
                  mkdir(path, 0755);
          }

          __attribute__((constructor))
          static void SRB2_iOS_Bootstrap(void)
          {
              const char *home = getenv("HOME");

              if (home)
              {
                  char documents[PATH_MAX];
                  char addons[PATH_MAX];
                  char logfile[PATH_MAX];

                  snprintf(documents, sizeof(documents), "%s/Documents", home);
                  snprintf(addons, sizeof(addons), "%s/Documents/Addons", home);
                  snprintf(logfile, sizeof(logfile), "%s/Documents/SRB2-runtime.log", home);

                  mkdir_if_needed(documents);
                  mkdir_if_needed(addons);

                  freopen(logfile, "a", stdout);
                  freopen(logfile, "a", stderr);
                  setvbuf(stdout, NULL, _IONBF, 0);
                  setvbuf(stderr, NULL, _IONBF, 0);

                  fprintf(stderr, "\n=== SRB2 iOS launch ===\n");
              }

              char executable[PATH_MAX];
              uint32_t size = (uint32_t)sizeof(executable);

              if (_NSGetExecutablePath(executable, &size) == 0)
              {
                  executable[sizeof(executable) - 1] = '\0';

                  char *slash = strrchr(executable, '/');
                  if (slash)
                  {
                      *slash = '\0';
                      chdir(executable);
                      fprintf(stderr, "bundle_cwd=%s\n", executable);
                  }
              }

              setenv("SDL_TOUCH_MOUSE_EVENTS", "1", 1);
          }
          C

          python3 <<'PY'
          from pathlib import Path
          import re

          top = Path("SRB2/CMakeLists.txt")
          s = top.read_text(encoding="utf-8")

          # v4 expected a literal SDL2 find_package line inside
          # src/sdl/CMakeLists.txt. SRB2 2.2.13 does not have that exact
          # layout, so v5 no longer patches src/sdl/CMakeLists.txt at all.

          s = re.sub(
              r'find_package\s*\(\s*CURL\s+REQUIRED\s*\)',
              'find_package(CURL QUIET)',
              s,
              count=1,
              flags=re.IGNORECASE
          )

          # The upstream file always downloads Ccache.cmake on non-Windows
          # hosts. It is optional and not useful for this one-shot iOS CI build.
          ccache_pattern = re.compile(
              r'else\(\)\s*'
              r'(CPMAddPackage\(\s*NAME\s+Ccache\.cmake.*?VERSION\s+1\.2\s*\))\s*'
              r'endif\(\)',
              re.IGNORECASE | re.DOTALL
          )
          s, ccache_patches = ccache_pattern.subn(
              r'elseif(NOT (APPLE AND "${CMAKE_SYSTEM_NAME}" STREQUAL "iOS"))\n    \1\nendif()',
              s,
              count=1
          )
          print(f"iOS ccache patch count: {ccache_patches}")

          # v12: keep the vcpkg iOS libraries visible from the TOP LEVEL.
          #
          # In v10, find_package(ZLIB) ran inside thirdparty/. Imported CMake
          # targets are directory-scoped unless they are GLOBAL, so src/
          # could not see ZLIB::ZLIB during the Generate step. That produced
          # CMake's "... target was not found / an ALIAS target is missing"
          # error after "Generating done".
          #
          # v12 finds ZLIB and PNG in the top-level directory BEFORE
          # add_subdirectory(thirdparty), so ZLIB::ZLIB and PNG::PNG are
          # visible to both thirdparty/ and src/. We also skip the old bundled
          # zlib/libpng builds on iOS. libgme remains a GLOBAL imported target.
          top_dependency_anchor = "# Dependencies\nadd_subdirectory(thirdparty)"
          top_ios_dependencies = r"""# SRB2 iOS v12: global vcpkg dependency targets
          if(APPLE AND "${CMAKE_SYSTEM_NAME}" STREQUAL "iOS")
              set(SRB2_IOS_VCPKG_PREFIX
                  "${CMAKE_SOURCE_DIR}/../vcpkg/installed/arm64-ios")
              list(PREPEND CMAKE_PREFIX_PATH
                  "${SRB2_IOS_VCPKG_PREFIX}")

              find_package(ZLIB REQUIRED)
              find_package(PNG REQUIRED)

              if(NOT TARGET ZLIB::ZLIB)
                  message(FATAL_ERROR
                      "SRB2 iOS v12: ZLIB::ZLIB target is missing")
              endif()
              if(NOT TARGET PNG::PNG)
                  message(FATAL_ERROR
                      "SRB2 iOS v12: PNG::PNG target is missing")
              endif()

              message(STATUS
                  "SRB2 iOS v12: global ZLIB::ZLIB and PNG::PNG targets ready")
          endif()

          # Dependencies
          add_subdirectory(thirdparty)"""

          if top_dependency_anchor not in s:
              raise SystemExit("ERROR: top-level dependency anchor not found")
          s = s.replace(
              top_dependency_anchor,
              top_ios_dependencies,
              1
          )

          thirdparty_cmake = Path("SRB2/thirdparty/CMakeLists.txt")
          thirdparty_text = thirdparty_cmake.read_text(encoding="utf-8")

          zlib_include = 'include("cpm-zlib.cmake")'
          zlib_replacement = r"""if(APPLE AND "${CMAKE_SYSTEM_NAME}" STREQUAL "iOS")
              message(STATUS "SRB2 iOS v12: using top-level vcpkg ZLIB")
          else()
              include("cpm-zlib.cmake")
          endif()"""
          if zlib_include not in thirdparty_text:
              raise SystemExit("ERROR: bundled zlib include anchor not found")
          thirdparty_text = thirdparty_text.replace(
              zlib_include, zlib_replacement, 1
          )

          png_include = 'include("cpm-png.cmake")'
          png_replacement = r"""if(APPLE AND "${CMAKE_SYSTEM_NAME}" STREQUAL "iOS")
              message(STATUS "SRB2 iOS v12: using top-level vcpkg libpng")
          else()
              include("cpm-png.cmake")
          endif()"""
          if png_include not in thirdparty_text:
              raise SystemExit("ERROR: bundled libpng include anchor not found")
          thirdparty_text = thirdparty_text.replace(
              png_include, png_replacement, 1
          )

          gme_include = 'include("cpm-libgme.cmake")'
          gme_replacement = r"""if(APPLE AND "${CMAKE_SYSTEM_NAME}" STREQUAL "iOS")
              message(STATUS "SRB2 iOS v12: using vcpkg libgme")

              set(SRB2_IOS_VCPKG_PREFIX
                  "${CMAKE_SOURCE_DIR}/../vcpkg/installed/arm64-ios")

              find_path(SRB2_IOS_GME_INCLUDE_DIR
                  NAMES gme/gme.h
                  PATHS "${SRB2_IOS_VCPKG_PREFIX}/include"
                  NO_DEFAULT_PATH)

              find_library(SRB2_IOS_GME_LIBRARY
                  NAMES gme
                  PATHS "${SRB2_IOS_VCPKG_PREFIX}/lib"
                  NO_DEFAULT_PATH)

              if(NOT SRB2_IOS_GME_INCLUDE_DIR OR NOT SRB2_IOS_GME_LIBRARY)
                  message(FATAL_ERROR
                      "vcpkg libgme for arm64-ios was not found")
              endif()

              add_library(gme STATIC IMPORTED GLOBAL)
              set_target_properties(gme PROPERTIES
                  IMPORTED_LOCATION "${SRB2_IOS_GME_LIBRARY}"
                  INTERFACE_INCLUDE_DIRECTORIES
                      "${SRB2_IOS_GME_INCLUDE_DIR}"
              )

              set(libgme_SOURCE_DIR
                  "${SRB2_IOS_GME_INCLUDE_DIR}"
                  CACHE PATH "" FORCE)
          else()
              include("cpm-libgme.cmake")
          endif()"""
          if gme_include not in thirdparty_text:
              raise SystemExit("ERROR: bundled libgme include anchor not found")
          thirdparty_text = thirdparty_text.replace(
              gme_include, gme_replacement, 1
          )

          thirdparty_cmake.write_text(thirdparty_text, encoding="utf-8")
          Path("output/ios-vcpkg-zlib-png-gme-patch.txt").write_text(
              top_ios_dependencies + "\n\n"
              + zlib_replacement + "\n\n"
              + png_replacement + "\n\n"
              + gme_replacement + "\n",
              encoding="utf-8"
          )
          print("Patched iOS build to use top-level vcpkg ZLIB/PNG and GLOBAL libgme.")

          # v12: SDL 2.24.2's HIDAPI Objective-C backend (hid.m) is the
          # exact file that failed under the current iPhoneOS/Xcode SDK in v11.
          # HIDAPI is optional on iOS; SDL's normal MFi/GameController path is
          # separate. Disable HIDAPI entirely for this iOS build.
          sdl2_cpm = Path("SRB2/thirdparty/cpm-sdl2.cmake")
          sdl2_text = sdl2_cpm.read_text(encoding="utf-8")

          sdl_options_anchor = '\t\t"SDL_TEST OFF"\n'
          sdl_ios_options = (
              '\t\t"SDL_HIDAPI OFF"\n'
              '\t\t"SDL_HIDAPI_JOYSTICK OFF"\n'
              '\t\t"SDL_HIDAPI_LIBUSB OFF"\n'
          )

          if '"SDL_HIDAPI OFF"' not in sdl2_text:
              if sdl_options_anchor not in sdl2_text:
                  raise SystemExit("ERROR: SDL2 CPM options anchor not found")
              sdl2_text = sdl2_text.replace(
                  sdl_options_anchor,
                  sdl_ios_options + sdl_options_anchor,
                  1
              )
              sdl2_cpm.write_text(sdl2_text, encoding="utf-8")

          Path("output/ios-sdl2-hidapi-patch.txt").write_text(
              sdl_ios_options,
              encoding="utf-8"
          )
          print("Disabled SDL2 HIDAPI for the iOS build.")

          # curl 7.86 defaults to OpenSSL when CMAKE_SYSTEM_NAME is iOS.
          # iPhoneOS has Apple's Security/SecureTransport instead, so force
          # curl to use that backend and never try to find desktop OpenSSL.
          curl_file = Path("SRB2/thirdparty/cpm-curl.cmake")
          curl_text = curl_file.read_text(encoding="utf-8")
          ios_curl_block = r"""
          if(APPLE AND "${CMAKE_SYSTEM_NAME}" STREQUAL "iOS")
              list(APPEND internal_curl_options "CURL_USE_OPENSSL OFF")
              list(APPEND internal_curl_options "CURL_USE_SECTRANSP ON")
          endif()
          """
          anchor = 'CPMAddPackage(\n\tNAME curl'
          if ios_curl_block.strip() not in curl_text:
              if anchor not in curl_text:
                  raise SystemExit("ERROR: curl CPM anchor not found")
              curl_text = curl_text.replace(anchor, ios_curl_block + "\n" + anchor, 1)
              curl_file.write_text(curl_text, encoding="utf-8")
          Path("output/curl-ios-patch.txt").write_text(ios_curl_block, encoding="utf-8")

          # SRB2 declares SRB2SDL2 as MACOSX_BUNDLE on Apple platforms,
          # but its non-Darwin install() branch only has RUNTIME DESTINATION.
          # CMake therefore rejects iOS during configure. Add the required
          # BUNDLE destination to that install rule while keeping desktop rules intact.
          sdl_cmake = Path("SRB2/src/sdl/CMakeLists.txt")
          sdl_text = sdl_cmake.read_text(encoding="utf-8")
          install_pattern = re.compile(
              r'install\s*\(\s*TARGETS\s+SRB2SDL2\s+SRB2SDL2\s*'
              r'RUNTIME\s+DESTINATION\s+\.\s*\)',
              re.IGNORECASE | re.DOTALL
          )
          install_replacement = """install(TARGETS SRB2SDL2 SRB2SDL2
              RUNTIME DESTINATION .
              BUNDLE DESTINATION .
          )"""
          sdl_text, install_patches = install_pattern.subn(
              install_replacement, sdl_text, count=1
          )
          if install_patches != 1:
              raise SystemExit(
                  f"ERROR: expected exactly one SRB2SDL2 install rule, patched {install_patches}"
              )
          sdl_cmake.write_text(sdl_text, encoding="utf-8")
          Path("output/ios-bundle-install-patch.txt").write_text(
              install_replacement + "\n", encoding="utf-8"
          )
          print("Patched SRB2SDL2 install rule with BUNDLE DESTINATION .")

          ios_patch = r"""

          # ===== SRB2 iOS PORT v12 =====
          if(APPLE AND "${CMAKE_SYSTEM_NAME}" STREQUAL "iOS")
              message(STATUS "Applying SRB2 iOS v12 target patch")

              if(NOT TARGET SRB2SDL2)
                  message(FATAL_ERROR "SRB2SDL2 target was not created by upstream CMake")
              endif()

              target_sources(SRB2SDL2 PRIVATE
                  "${CMAKE_SOURCE_DIR}/src/sdl/ios_bootstrap.c"
              )

              target_compile_definitions(SRB2SDL2 PRIVATE
                  NOEXECINFO
                  SRB2_IOS_PORT
              )

              if(TARGET SDL2::SDL2main)
                  target_link_libraries(SRB2SDL2 PRIVATE SDL2::SDL2main)
              elseif(TARGET SDL2main)
                  target_link_libraries(SRB2SDL2 PRIVATE SDL2main)
              endif()

              target_link_libraries(SRB2SDL2 PRIVATE
                  "-framework UIKit"
                  "-framework Foundation"
                  "-framework CoreGraphics"
                  "-framework CoreMotion"
                  "-framework AVFoundation"
                  "-framework AudioToolbox"
                  "-framework GameController"
                  "-framework OpenGLES"
                  "-framework Metal"
                  "-framework QuartzCore"
              )
          endif()
          # ===== END SRB2 iOS PORT v12 =====
          """

          if "SRB2 iOS PORT v12" not in s:
              s = s.rstrip() + "\n" + ios_patch + "\n"

          top.write_text(s, encoding="utf-8")

          Path("output/cmake-ios-patch.txt").write_text(
              ios_patch,
              encoding="utf-8"
          )

          print("Patched top-level CMakeLists.txt")
          print("No SDL2 find_package anchor is required anymore.")
          PY

          echo "===== IOS PATCH ====="
          tail -80 SRB2/CMakeLists.txt
          echo "===== IOS BUNDLE INSTALL PATCH ====="
          sed -n '72,96p' SRB2/src/sdl/CMakeLists.txt
          echo "===== IOS ZLIB/PNG/LIBGME PATCH ====="
          cat output/ios-vcpkg-zlib-png-gme-patch.txt
          echo "===== SDL2 IOS HIDAPI PATCH ====="
          cat output/ios-sdl2-hidapi-patch.txt
          sed -n '1,40p' SRB2/thirdparty/cpm-sdl2.cmake
          echo "===== CURL IOS PATCH ====="
          sed -n '1,90p' SRB2/thirdparty/cpm-curl.cmake
          echo "===== BOOTSTRAP ====="
          sed -n '1,220p' SRB2/src/sdl/ios_bootstrap.c

      - name: Patch iPhoneOS system compatibility v13
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PYV13'
          from pathlib import Path

          p = Path("SRB2/src/sdl/i_system.c")
          s = p.read_text(encoding="utf-8")

          old = "#include <nlist.h>\\n#include <sys/sysctl.h>"
          new = "#ifndef SRB2_IOS_PORT\\n#include <nlist.h>\\n#include <sys/sysctl.h>\\n#endif"
          if old not in s:
              raise SystemExit("ERROR: nlist/sysctl anchor not found")
          s = s.replace(old, new, 1)

          old = '#ifdef __APPLE__\\n#include "macosx/mac_resources.h"\\n#endif'
          new = '#if defined(__APPLE__) && !defined(SRB2_IOS_PORT)\\n#include "macosx/mac_resources.h"\\n#endif'
          if old not in s:
              raise SystemExit("ERROR: mac_resources anchor not found")
          s = s.replace(old, new, 1)

          old = "#if defined (__unix__) || defined(__APPLE__) || defined (UNIXCOMMON)\\n#include <execinfo.h>\\n#include <time.h>\\n#define UNIXBACKTRACE\\n#endif"
          new = "#if defined (__unix__) || defined(__APPLE__) || defined (UNIXCOMMON)\\n#include <time.h>\\n#if !defined(SRB2_IOS_PORT)\\n#include <execinfo.h>\\n#define UNIXBACKTRACE\\n#endif\\n#endif"
          if old not in s:
              raise SystemExit("ERROR: execinfo anchor not found")
          s = s.replace(old, new, 1)

          old = "#ifdef __APPLE__\\n\\tOSX_GetResourcesPath(returnWadPath);\\n\\tCHECKWADPATH(returnWadPath);\\n#endif"
          new = "#if defined(__APPLE__) && !defined(SRB2_IOS_PORT)\\n\\tOSX_GetResourcesPath(returnWadPath);\\n\\tCHECKWADPATH(returnWadPath);\\n#endif"
          if old not in s:
              raise SystemExit("ERROR: OSX_GetResourcesPath anchor not found")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("SRB2 v13 iPhoneOS system patch applied")
          PYV13

          echo "===== VERIFY V13 IOS SYSTEM PATCH ====="
          grep -n -E 'nlist|sysctl|execinfo|OSX_GetResourcesPath|SRB2_IOS_PORT' \
            SRB2/src/sdl/i_system.c || true

      - name: Configure iPhone arm64 build
        id: configure
        shell: bash
        run: |
          set -o pipefail
          rm -rf build
          cmake \
            -S SRB2 \
            -B build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSRB2_CONFIG_ENABLE_TESTS=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_HIDAPI_JOYSTICK=OFF \
            -DSDL_HIDAPI_LIBUSB=OFF \
            -DCURL_USE_OPENSSL=OFF \
            -DCURL_USE_SECTRANSP=ON \
            -DSRB2_CONFIG_HWRENDER=OFF \
            -DSRB2_CONFIG_ERRORMODE=OFF \
            -DSRB2_SDL2_EXE_NAME=SRB2 \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee output/cmake-configure.log

      - name: Build Sonic Robo Blast 2 for iPhone
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build \
            --config Release \
            --target SRB2SDL2 \
            -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee output/xcodebuild.log

      - name: Locate or create app bundle
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build -type d -name '*.app' | head -1 || true)"
          rm -rf stage
          mkdir -p stage

          if [ -n "$APP" ]; then
            echo "Using generated app: $APP"
            cp -a "$APP" stage/SRB2.app
          else
            BIN="$(find build -type f -perm +111 -name 'SRB2' | head -1 || true)"
            if [ -z "$BIN" ]; then
              echo "ERROR: SRB2 arm64 executable not found"
              exit 1
            fi
            mkdir -p stage/SRB2.app
            cp "$BIN" stage/SRB2.app/SRB2
          fi

          APP="stage/SRB2.app"
          chmod +x "$APP/SRB2" 2>/dev/null || true
          file "$APP/SRB2" | tee output/macho.txt
          lipo -info "$APP/SRB2" | tee -a output/macho.txt || true
          file "$APP/SRB2" | grep -q arm64
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Add game data plist and icon
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.app }}"

          # Bundle the exact data from the Android v2.2.13 patch1 APK.
          # This keeps iOS game data aligned with the user's Android build.
          cp -a apk-src/assets/. "$APP/"

          # Exact Android launcher artwork.
          cp output/SRB2-Android-Icon.png "$APP/Icon.png"

          # Generate common iPhone icon sizes from the exact Android icon.
          sips -z 120 120 output/SRB2-Android-Icon.png --out "$APP/Icon-60@2x.png" >/dev/null
          sips -z 180 180 output/SRB2-Android-Icon.png --out "$APP/Icon-60@3x.png" >/dev/null
          sips -z 152 152 output/SRB2-Android-Icon.png --out "$APP/Icon-76@2x.png" >/dev/null
          sips -z 167 167 output/SRB2-Android-Icon.png --out "$APP/Icon-83.5@2x.png" >/dev/null

          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>Sonic Robo Blast 2</string>
            <key>CFBundleExecutable</key><string>SRB2</string>
            <key>CFBundleIdentifier</key><string>org.stjr.srb2</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>SRB2</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.2.13</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UIRequiresFullScreen</key><true/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>CFBundleIconFiles</key>
            <array><string>Icon.png</string></array>
            <key>UIApplicationSupportsIndirectInputEvents</key><true/>
          </dict>
          </plist>
          PLIST

          find "$APP" -maxdepth 1 -type f -print | sort | tee output/app-files.txt

      - name: Create unsigned IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -a stage/SRB2.app Payload/
          zip -qry Sonic-Robo-Blast-2-iOS-v13-UNSIGNED.ipa Payload
          ls -lh Sonic-Robo-Blast-2-iOS-v13-UNSIGNED.ipa

      - name: Save build logs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p output
          {
            echo "SRB2 iOS v13"
            echo "CONFIGURE=${{ steps.configure.outcome }}"
            echo "BUILD=${{ steps.build.outcome }}"
            echo "APP=${{ steps.app.outcome }}"
            echo "IPA=${{ steps.ipa.outcome }}"
            xcodebuild -version
            cmake --version | head -1
          } > output/summary.txt
          find build -maxdepth 6 -type f 2>/dev/null | sort > output/build-files.txt || true
          tail -500 output/cmake-configure.log > output/cmake-configure-tail.txt 2>/dev/null || true
          tail -800 output/xcodebuild.log > output/xcodebuild-tail.txt 2>/dev/null || true
          grep -n -E '(^|[[:space:]])(fatal )?error:|Undefined symbols|ld: |clang: error:|libtool: error:' \
            output/xcodebuild.log > output/xcodebuild-errors.txt 2>/dev/null || true

      - name: Upload Sonic Robo Blast 2 IPA
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Robo-Blast-2-iOS-v13-UNSIGNED
          path: Sonic-Robo-Blast-2-iOS-v13-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Robo-Blast-2-iOS-v13-Logs
          path: output
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Build result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.ipa.outcome }}" = "success" ]; then
            echo "SUCCESS: Sonic Robo Blast 2 iOS v13 IPA created."
          else
            echo "The build stopped before the IPA was created."
            echo "The FIRST red step above is now the real error."
            echo "Sonic-Robo-Blast-2-iOS-v13-Logs was uploaded for diagnostics."
          fi
